name: Generate Snake
 
on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch: {}
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG del snake
        uses: Platane/snk@v3
        with:
          github_user_name: idavanzohellehollis
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E42313&color_dots=%23161b22,%230d3320,%2314522f,%231c7d3f,%23007D32
 
      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
